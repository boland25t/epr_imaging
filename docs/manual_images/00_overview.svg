<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
    <style>
      .col{font-size:12px;letter-spacing:.14em;fill:#0e6d78;font-family:IBM Plex Mono, monospace}
      .box{fill:#ffffff;stroke:#c9d3db;stroke-width:1.2}
      .key{fill:#e3eef0;stroke:#0e6d78;stroke-width:1.4}
      .t{font-size:14px;fill:#16222b;font-weight:600}
      .s{font-size:11.5px;fill:#5a6b78}
      .ln{stroke:#5a6b78;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#f6f8fa"/>
  <text class="col" x="20" y="28">YOU IMPORT</text>
  <text class="col" x="300" y="28">THE APP BUILDS</text>
  <text class="col" x="640" y="28">PRODUCTS YOU BROWSE</text>

  <!-- inputs -->
  <rect class="box" x="20" y="44" width="220" height="56" rx="6"/>
  <text class="t" x="34" y="67">Navigation (renav CSV)</text>
  <text class="s" x="34" y="86">position, depth, heading, pitch, roll</text>
  <rect class="box" x="20" y="112" width="220" height="56" rx="6"/>
  <text class="t" x="34" y="135">Altitude (DPA CSV)</text>
  <text class="s" x="34" y="154">height above seafloor</text>
  <rect class="box" x="20" y="180" width="220" height="56" rx="6"/>
  <text class="t" x="34" y="203">Sensor channels (CSV)</text>
  <text class="s" x="34" y="222">e.g. CH4, CO2, O2, T, S</text>
  <rect class="box" x="20" y="322" width="220" height="56" rx="6"/>
  <text class="t" x="34" y="345">Downward video</text>
  <text class="s" x="34" y="364">a folder of time-stamped files</text>

  <!-- builds -->
  <rect class="key" x="300" y="112" width="260" height="70" rx="6"/>
  <text class="t" x="314" y="137">1 Hz table (interp_full.csv)</text>
  <text class="s" x="314" y="156">every input resampled onto one</text>
  <text class="s" x="314" y="171">clock, UTC, with UTM position</text>
  <rect class="key" x="300" y="310" width="260" height="80" rx="6"/>
  <text class="t" x="314" y="335">Frame set</text>
  <text class="s" x="314" y="354">still frames pulled from the video</text>
  <text class="s" x="314" y="369">every 0.25 m of travel (sampling</text>
  <text class="s" x="314" y="384">technique), reused between runs</text>

  <path class="ln" d="M240,72 C270,72 272,135 298,138"/>
  <path class="ln" d="M240,140 L298,145"/>
  <path class="ln" d="M240,208 C270,208 272,160 298,155"/>
  <path class="ln" d="M240,350 L298,350"/>
  <path class="ln" d="M430,182 L430,308"/>

  <!-- products -->
  <rect class="box" x="640" y="44" width="300" height="188" rx="6"/>
  <text class="t" x="654" y="66">From the 1 Hz table</text>
  <text class="s" x="654" y="87">Nav Trackline (GeoJSON)</text>
  <text class="s" x="654" y="105">Depth Raster (GeoTIFF)</text>
  <text class="s" x="654" y="123">Sensor Raster (GeoTIFF, one per channel)</text>
  <text class="s" x="654" y="141">Spectrum Trackline (PNG)</text>
  <text class="s" x="654" y="159">Anomaly Detection (MATLAB) — tables, layers</text>
  <text class="s" x="654" y="177">Anomaly Trackline (PNG)</text>
  <text class="s" x="654" y="200" font-style="italic">one per job; independent of sampling</text>
  <rect class="box" x="640" y="260" width="300" height="118" rx="6"/>
  <text class="t" x="654" y="282">From a frame set</text>
  <text class="s" x="654" y="303">Photogrammetry (Metashape): ortho, DEM,</text>
  <text class="s" x="654" y="319">   point clouds, mesh — per chunk</text>
  <text class="s" x="654" y="337">Fauna Detection (YOLOv8): detections, density</text>
  <text class="s" x="654" y="360" font-style="italic">one per job and sampling run</text>
  <rect class="box" x="640" y="400" width="300" height="52" rx="6"/>
  <text class="t" x="654" y="422">Survey Report · Product catalog (PDF)</text>
  <text class="s" x="654" y="440">gathers what already exists</text>

  <path class="ln" d="M560,140 L638,140"/>
  <path class="ln" d="M560,350 L638,320"/>
  <path class="ln" d="M790,378 L790,398"/>
  <path class="ln" d="M942,232 C955,300 955,380 942,420"/>
</svg>
