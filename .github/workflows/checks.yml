name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install check dependencies
        # Only what the checks need.  The Qt/geo stack is deliberately NOT
        # installed: the linter is pure AST analysis and the unit tests cover
        # the Qt-free service layer, so CI stays fast and does not need a
        # display server.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyflakes

      - name: Byte-compile every module
        run: python -m compileall -q . -x '(archive|BioIntervals|3dvistool|\.git)'

      - name: Static analysis (undefined names)
        # Undefined names are hard errors — this class of bug shipped once
        # already (matplotlib symbols used in a function that never imported
        # them, which silently broke raster map export).
        run: |
          python -m pyflakes $(git ls-files '*.py' \
            | grep -v -E '^(archive|BioIntervals|3dvistool)/') \
            | grep -E 'undefined name' && exit 1 || true

      - name: Qt threading + datetime invariants
        # Guards two whole-app rules static tools cannot see:
        #   1. no lambda/plain-function slots on worker signals (they run on the
        #      worker thread and abort the process if they touch widgets)
        #   2. no deprecated naive-UTC datetime APIs
        run: python tools/lint_qt_threading.py

      - name: Unit tests
        run: python -m pytest tests -q
